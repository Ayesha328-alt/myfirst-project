<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, Helvetica, sans-serif;
            color: #eafcff;
            background:
                radial-gradient(circle at 15% 20%, rgba(0, 217, 255, 0.18), transparent 30%),
                linear-gradient(135deg, #06131f, #0b1d2d 55%, #07111d);
        }

        .container {
            width: min(900px, 92%);
            margin: 40px auto;
            padding: 28px;
            border: 1px solid rgba(86, 228, 255, 0.25);
            border-radius: 24px;
            background: rgba(8, 24, 38, 0.88);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
        }

        h1 {
            margin: 0 0 22px;
            text-align: center;
            font-size: clamp(2rem, 6vw, 3.6rem);
            color: #65efff;
            text-shadow: 0 0 18px rgba(101, 239, 255, 0.45);
        }

        .cyber-image {
            display: block;
            width: 100%;
            max-height: 430px;
            object-fit: cover;
            border: 2px solid rgba(101, 239, 255, 0.35);
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
        }

        p {
            margin: 22px auto 6px;
            max-width: 700px;
            text-align: center;
            line-height: 1.7;
            color: #c9dbe4;
            font-size: 1.1rem;
        }

        .highlight {
            color: #65efff;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Welcome to My Cyber World!</h1>

        <img class="cyber-image"
             src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=1200&q=85"
             alt="Cybersecurity computer screen with digital security graphics">

        <p>I am learning <span class="highlight">programming</span>, VS Code, Git and GitHub — and building my future in technology.</p>
    </main>
</body>
</html>
